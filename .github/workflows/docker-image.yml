name: Docker image

on:
  push:
    # Publish `main` as Docker `latest` image.
    branches:
      - main

    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

  # Run tests for any PRs.
  pull_request:

env:
  IMAGE_NAME: mrbs

jobs:
  # Build and smoke-test the image for PRs (safe for forked PRs)
  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.2', '8.3', '8.4', '8.5']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Start MySQL
        run: |
          # mysql_native_password is disabled by default in 8.4, but PHP < 7.4 needs it
          docker run -d --name mrbs-db \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=mrbs \
            -e MYSQL_USER=mrbs \
            -e MYSQL_PASSWORD=mrbs \
            -p 3306:3306 \
            mysql:8.4 --mysql-native-password=ON

      - name: Wait for DB
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          until mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; do sleep 1; done

      - name: Load MySQL schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot mrbs < tables.my.sql
          # PHP < 7.4 does not support MySQL 8's default caching_sha2_password
          mysql -h 127.0.0.1 -uroot -proot -e "ALTER USER 'mrbs'@'%' IDENTIFIED WITH mysql_native_password BY 'mrbs'"

      - name: Load test fixtures
        run: |
          mysql -h 127.0.0.1 -uroot -proot mrbs < test/ci/fixtures.my.sql

      - uses: docker/setup-buildx-action@v4

      - name: Build image (test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,scope=php-${{ matrix.php }},mode=max

      - name: Run container (connect to service DB via host-gateway)
        run: |
          # Run containers and make host.docker.internal available inside them so they can reach the Actions service.
          # The main container sets $url_base (password reset enabled); the nobase container does not.
          docker run --rm -d \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD/test/ci/php-test.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            -e MRBS_DB_SYSTEM=mysql \
            -e MRBS_DB_HOST=host.docker.internal \
            -e MRBS_DB_DATABASE=mrbs \
            -e MRBS_DB_USER=mrbs \
            -e MRBS_DB_PASSWORD=mrbs \
            -e MRBS_URL_BASE=http://localhost:8080/ \
            -p 8080:80 \
            --name mrbs-test $IMAGE_NAME
          docker run --rm -d \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD/test/ci/php-test.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            -e MRBS_DB_SYSTEM=mysql \
            -e MRBS_DB_HOST=host.docker.internal \
            -e MRBS_DB_DATABASE=mrbs \
            -e MRBS_DB_USER=mrbs \
            -e MRBS_DB_PASSWORD=mrbs \
            -p 8081:80 \
            --name mrbs-test-nobase $IMAGE_NAME

      - name: Wait for webserver
        run: |
          # wait for Apache inside the containers to start
          for port in 8080 8081; do
            for i in {1..30}; do
              if curl -sSf http://localhost:$port/ >/dev/null; then
                echo ready && break
              fi
              sleep 1
            done
          done

      - name: HTTP smoke checks
        run: |
          curl -fsS http://localhost:8080/ || (docker logs mrbs-test && exit 1)
          curl -fsS http://localhost:8080/reset_password.php | grep -qi 'reset' || true

      - name: Functional tests
        run: |
          python3 -m pip install -r test/ci/requirements.txt
          MRBS_URL_NOBASE=http://localhost:8081/ python3 -m pytest test/ci -v || (docker logs mrbs-test && docker logs mrbs-test-nobase && exit 1)

      - name: PHP error log checks
        run: |
          # Known bug, issue #4079: the main instance logs a get_booking_info() TypeError from a redirect
          test/ci/check-php-log.sh mrbs-test 'get_booking_info\(\): Argument #1'
          # The nobase instance logs the "No trusted base" warning on every request by design (see AuthDb.php)
          test/ci/check-php-log.sh mrbs-test-nobase 'No trusted base available'

      - name: Stop test containers
        if: always()
        run: docker stop mrbs-test mrbs-test-nobase || true

  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  push:
    runs-on: ubuntu-latest
    # Only publish from pushes to main or tags (not PRs), and only if the tests pass
    needs: test
    if: ${{ github.event_name == 'push' }}
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          # Reuse the layers cached by the default PHP version in the test job
          cache-from: type=gha,scope=php-8.4

      - name: Log in to registry
        # This is where you will update the personal access token to GITHUB_TOKEN
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          # Use Docker `latest` tag convention
          [ "$VERSION" == "main" ] && VERSION=latest
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
